# Image de slo-sync : voir go-image.yml (tests dans le Dockerfile, scan, publication, signature).
name: slo-sync
on:
  pull_request:
    paths: ["slo-sync/**", ".github/workflows/slo-sync.yml", ".github/workflows/go-image.yml"]
  push:
    branches: [main]
    paths: ["slo-sync/**", ".github/workflows/slo-sync.yml", ".github/workflows/go-image.yml"]
permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/go-image.yml
    with:
      component: slo-sync
