# Image d'alert-bridge : voir go-image.yml (tests dans le Dockerfile, scan, publication, signature).
name: alert-bridge
on:
  pull_request:
    paths: ["alert-bridge/**", ".github/workflows/alert-bridge.yml", ".github/workflows/go-image.yml"]
  push:
    branches: [main]
    paths: ["alert-bridge/**", ".github/workflows/alert-bridge.yml", ".github/workflows/go-image.yml"]
permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/go-image.yml
    with:
      component: alert-bridge
