# Exceptions Trivy justifiées. Toute nouvelle entrée doit être relue par un humain (CODEOWNERS).
misconfigurations:
  - id: KSV-0041
    paths: ["cluster/base/configs/tenant-rbac/tenant-deployer.yaml"]
    statement: >-
      Le compte Flux d'une application gère les Secrets de SON namespace uniquement (RoleBinding),
      nécessaire pour appliquer ses Secrets SOPS déchiffrés. ADR-0006.
  - id: KSV-0056
    paths: ["cluster/base/configs/tenant-rbac/tenant-deployer.yaml"]
    statement: >-
      Ingress uniquement (pas de NetworkPolicy), dans le namespace de l'application ; les hôtes sont
      contraints par la VAP platform-ingress-hosts. ADR-0005/0006.
  # Jeux de test des règles d'admission : volontairement non conformes.
  - id: KSV-0118
    paths: ["cluster/base/policies/tests/**"]
    statement: Données de test (cas refusés exprès).
  # Hetzner Object Storage (compatible S3, pas AWS) : pas de KMS ; buckets privés par défaut et
  # « Public Access Block » non garanti par l'API Hetzner. Vérification manuelle dans le runbook
  # migration-hetzner (étape « buckets privés »). À réévaluer si Hetzner prend en charge ces API.
  - id: AWS-0132
    paths: ["tofu/envs/hetzner/buckets.tf"]
    statement: Pas de KMS chez Hetzner Object Storage.
  - id: AWS-0086
    paths: ["tofu/envs/hetzner/buckets.tf"]
    statement: Buckets privés par défaut chez Hetzner ; API Public Access Block non garantie.
  - id: AWS-0087
    paths: ["tofu/envs/hetzner/buckets.tf"]
    statement: Idem AWS-0086.
  - id: AWS-0091
    paths: ["tofu/envs/hetzner/buckets.tf"]
    statement: Idem AWS-0086.
  - id: AWS-0093
    paths: ["tofu/envs/hetzner/buckets.tf"]
    statement: Idem AWS-0086.
