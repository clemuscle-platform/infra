# Droits du compte Flux qui déploie une application dans SON espace de noms (ADR-0006).
# Plus restreint que « admin » : pas de NetworkPolicy, ResourceQuota, LimitRange, Role/RoleBinding,
# ni de Service LoadBalancer/NodePort (refusés par admission). L'isolation ne peut donc pas être
# défaite par un manifeste d'application.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-tenant-deployer
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases, scheduledbackups, backups, poolers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
