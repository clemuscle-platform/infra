# Échecs de réconciliation Flux → alert-bridge → ticket GitHub (boucle incident).
# Le Secret flux-alert-bridge contient la clé « headers » : « X-Platform-Token: <jeton> ».
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alert-bridge
  namespace: flux-system
spec:
  type: generic
  address: http://alert-bridge.platform-ops.svc.cluster.local:8080/hooks/flux
  secretRef:
    name: flux-alert-bridge
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: reconciliation-failures
  namespace: flux-system
spec:
  providerRef:
    name: alert-bridge
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: GitRepository
      name: "*"
  exclusionList:
    # Une seule tentative ratée pendant une mise à jour n'est pas un incident.
    - ".*dependency.*not ready.*"
