apiVersion: apps/v1
kind: Deployment
metadata:
  name: ko-wrong-app-label
  namespace: app-hello-staging
  labels:
    app.kubernetes.io/name: hello
    platform.io/app: autre
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      automountServiceAccountToken: false
      containers:
      - name: web
