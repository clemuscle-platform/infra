---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ko-cron-token
  namespace: app-hello-staging
  labels:
    app.kubernetes.io/name: hello
    platform.io/app: hello
spec:
  schedule: 0 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: job
            image: ghcr.io/clemuscle-platform/hello:1.2.3
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ok-clusterip
  namespace: app-hello-staging
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/name: hello
---
apiVersion: v1
kind: Service
metadata:
  name: ko-loadbalancer
  namespace: app-hello-staging
spec:
  type: LoadBalancer
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ok-ingress
  namespace: app-hello-staging
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - hello-staging.localhost
    secretName: hello-tls
  rules:
  - host: hello-staging.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ko-ingress-other-app
  namespace: app-hello-staging
spec:
  ingressClassName: traefik
  rules:
  - host: billing.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hello
            port:
              number: 80
