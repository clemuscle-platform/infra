# Objets namespacés (Cluster CNPG, PVC) dans un namespace de production.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-protect-prod-data
spec:
  policyName: platform-protect-prod-data
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        platform.io/tier: prod
---
# Le namespace de production lui-même (objectSelector évalué sur l'objet supprimé).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-protect-prod-namespaces
spec:
  policyName: platform-protect-prod-data
  validationActions: [Deny]
  matchResources:
    objectSelector:
      matchLabels:
        platform.io/tier: prod
