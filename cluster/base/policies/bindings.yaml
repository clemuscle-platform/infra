apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-workload-images
spec:
  policyName: platform-workload-images
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        platform.io/managed: "true"
