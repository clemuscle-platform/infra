# Couches de la plateforme, appliquées dans l'ordre par Flux :
#   controllers -> configs -> policies -> tenants -> apps
#   ops (alert-bridge) dépend de configs, mais rien ne dépend de lui : son absence ne bloque rien.
# ${CLUSTER_ENV} vient de la ConfigMap flux-runtime-info de la surcouche.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-controllers
  namespace: flux-system
spec:
  serviceAccountName: flux-operator
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  wait: true
  prune: true
  path: ./cluster/${CLUSTER_ENV}/controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-controllers
  serviceAccountName: flux-operator
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./cluster/${CLUSTER_ENV}/configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-policies
  namespace: flux-system
spec:
  serviceAccountName: flux-operator
  interval: 30m
  retryInterval: 2m
  timeout: 2m
  wait: true
  # Les règles d'admission ne sont jamais supprimées automatiquement.
  prune: false
  path: ./cluster/base/policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-tenants
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-configs
    - name: platform-policies
  serviceAccountName: flux-operator
  interval: 30m
  retryInterval: 2m
  timeout: 5m
  wait: true
  prune: true
  path: ./cluster/base/tenants
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-tenants
  serviceAccountName: flux-operator
  interval: 10m
  retryInterval: 1m
  timeout: 2m
  prune: true
  path: ./cluster/apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ops
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-configs
  serviceAccountName: flux-operator
  interval: 30m
  retryInterval: 5m
  timeout: 3m
  wait: true
  prune: true
  path: ./cluster/${CLUSTER_ENV}/ops
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
