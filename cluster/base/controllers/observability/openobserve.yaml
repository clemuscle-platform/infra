# OpenObserve en nœud unique (ADR-0010). Stockage : disque en local, S3 sur Hetzner (patch de surcouche).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-observability
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openobserve
  namespace: flux-system
spec:
  interval: 6h
  url: https://charts.openobserve.ai
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openobserve
  namespace: flux-system
spec:
  interval: 30m
  releaseName: openobserve
  targetNamespace: platform-observability
  storageNamespace: platform-observability
  serviceAccountName: flux-operator
  chart:
    spec:
      chart: openobserve-standalone
      version: 1.1.6
      sourceRef:
        kind: HelmRepository
        name: openobserve
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    fullnameOverride: openobserve
    auth:
      # Le Secret openobserve-root (SOPS) est fourni par la surcouche.
      existingRootUserSecret:
        name: openobserve-root
      ZO_ROOT_USER_EMAIL: ""
      ZO_ROOT_USER_PASSWORD: ""
      O2_MCP_USERNAME: ""
      O2_MCP_PASSWORD: ""
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ${STORAGE_CLASS}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    podSecurityContext:
      fsGroup: 2000
      runAsUser: 10000
      runAsGroup: 3000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 768Mi}
    config:
      ZO_TELEMETRY: "false"
      # Garde-fou SSRF : seule exception, la destination d'alerte interne (correspondance exacte).
      ZO_SSRF_ALLOWED_HOSTS: alert-bridge.platform-ops.svc.cluster.local
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      ZO_MEMORY_CACHE_ENABLED: "true"
      ZO_MEMORY_CACHE_MAX_SIZE: "128"
