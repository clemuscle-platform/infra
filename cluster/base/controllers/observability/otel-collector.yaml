# OpenTelemetry Collector en DaemonSet (ADR-0010).
# Espace de noms séparé : il lit /var/log/pods (hostPath), interdit en PSA baseline/restricted.
# La configuration (récepteurs, masquage, export) est dans otel-values.yaml, testé en CI.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-otel
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: flux-system
spec:
  interval: 6h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  dependsOn:
    - name: openobserve
  interval: 30m
  releaseName: otel-collector
  targetNamespace: platform-otel
  storageNamespace: platform-otel
  serviceAccountName: flux-operator
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.178.3
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  valuesFrom:
    - kind: ConfigMap
      name: otel-collector-values
      valuesKey: values.yaml
