# cert-manager. releaseName et espace de noms de stockage identiques à l'installation manuelle
# existante sur le k3s local : helm-controller reprend la release au lieu d'en créer une seconde.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.3
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager
  serviceAccountName: flux-operator
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    crds:
      enabled: true
      keep: true
    global:
      leaderElection:
        namespace: cert-manager
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 128Mi}
    webhook:
      resources:
        requests: {cpu: 10m, memory: 24Mi}
        limits: {memory: 64Mi}
    cainjector:
      resources:
        requests: {cpu: 10m, memory: 48Mi}
        limits: {memory: 160Mi}
