# Opérateur Tailscale (ADR-0012) : expose les interfaces internes (OpenObserve…) sur le tailnet uniquement.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 6h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 30m
  releaseName: tailscale-operator
  targetNamespace: tailscale
  storageNamespace: tailscale
  serviceAccountName: flux-operator
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.7
      sourceRef:
        kind: HelmRepository
        name: tailscale
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    # Identifiants OAuth : Secret « operator-oauth » (SOPS) dans le namespace tailscale.
    operatorConfig:
      hostname: ${CLUSTER_NAME}-operator
      defaultTags: "tag:k8s-operator"
    proxyConfig:
      defaultTags: "tag:k8s"
