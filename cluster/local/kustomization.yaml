# Point d'entrée de l'environnement « local » (FluxInstance.spec.sync.path = cluster/local).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/flux-system
  - ../base/platform
  - runtime-info.yaml
patches:
  - target:
      kind: FluxInstance
      name: flux
    patch: |
      - op: replace
        path: /spec/sync/path
        value: cluster/local
