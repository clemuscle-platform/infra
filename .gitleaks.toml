# Règles Gitleaks par défaut + exclusion des seuls dossiers générés (jamais versionnés).
[extend]
useDefault = true

[[allowlists]]
description = "Dossiers générés : modules et fournisseurs OpenTofu téléchargés, sorties de validation"
paths = [
  '''(^|/)\.terraform/''',
  '''(^|/)out/''',
  '''(^|/)\.cache/''',
]

[[allowlists]]
description = "Jeu de test du masquage OTel : faux secrets volontaires (préfixe FAUX), vérifiés par check.py"
paths = [
  '''^cluster/base/controllers/observability/tests/redaction/input\.jsonl$''',
]
